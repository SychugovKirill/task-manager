version: "3.8"

services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tasks}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}

  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:-"postgresql+asyncpg://postgres:postgres@db:5432/tasks"}
      PYTHONPATH: /app

  async_worker:
    build: .
    command: python app/workers/worker.py
    depends_on:
      - rabbitmq
      - db
    environment:
      DATABASE_URL: ${DATABASE_URL:-"postgresql+asyncpg://postgres:postgres@db:5432/tasks"}
      PYTHONPATH: /app

volumes:
  postgres_data:
